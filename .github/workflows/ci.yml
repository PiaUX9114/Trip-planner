name: Trip Planner checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Verify M7 installation
        run: node scripts/m7-install.mjs --check-only
      - name: Run checks
        run: npm run check
      - name: Production build
        run: npm run build
      - name: Release preflight
        run: npm run m7:preflight
